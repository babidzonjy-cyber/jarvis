services:

  jarvis:
    build: .
    container_name: jarvis
    ports:
      - 8080:8080
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    depends_on:
      jarvis-postgres:
        condition: service_healthy

  jarvis-postgres:
    image: postgres:18.1-bookworm
    container_name: jarvis-postgres
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./out/pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
        interval: 3s
        timeout: 3s
        retries: 10

  jarvis-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ./internal/migrations:/migrations
    depends_on:
      jarvis-postgres:
        condition: service_healthy
